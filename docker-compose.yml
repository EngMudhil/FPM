services:
  postgres:
    image: postgres:16-alpine
    container_name: fpm-postgres
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: fpm
      POSTGRES_PASSWORD: fpm_dev_password
      POSTGRES_DB: fpm_dev
    volumes:
      - fpm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fpm -d fpm_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fpm-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - fpm_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fpm_postgres_data:
  fpm_redis_data:
